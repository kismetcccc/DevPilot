name: devpilot-memory
services:
  postgres:
    image: postgres:16.14-trixie
    environment:
      POSTGRES_USER: devpilot
      POSTGRES_DB: devpilot
      POSTGRES_PASSWORD: ${DEVPILOT_POSTGRES_PASSWORD:?Set DEVPILOT_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${DEVPILOT_POSTGRES_PORT:-55432}:5432"
    volumes:
      - memory-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devpilot -d devpilot"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  memory-data:
